<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cave Drone Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070b; --panel: rgba(12, 17, 26, .66); --line: rgba(160, 190, 230, .12);
    --text: #e3eaf3; --muted: #7f8ea3; --accent: #22d3ee; --good: #4ade80; --warn: #fbbf24; --bad: #f87171;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
               font: 13px/1.45 Inter, system-ui, "Segoe UI", sans-serif; }
  canvas { display: block; }
  #labels { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .panel { position: absolute; z-index: 2; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
           backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
           box-shadow: 0 12px 32px rgba(0, 0, 0, .35); }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  body.ui-hidden .panel { display: none; }

  /* ---------------------------------------------------------- mission panel */
  #hud { top: 14px; left: 14px; width: 300px; padding: 14px; max-height: calc(100% - 150px); overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; flex: none;
          background: conic-gradient(from 200deg, #8b5cf6, #3b82f6, #22d3ee, #8b5cf6);
          box-shadow: 0 0 18px rgba(34, 211, 238, .45); position: relative; }
  .logo::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: #0b111a; }
  .title { font-weight: 700; letter-spacing: .14em; font-size: 12px; }
  .sub { font-size: 11px; color: var(--muted); }
  .conn::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
                  background: var(--warn); margin: 0 4px 1px 0; }
  .conn.on::before { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .conn.off::before { background: var(--bad); }
  .clock { margin-top: 14px; font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .clock small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .progress { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .07); overflow: hidden; margin-top: 4px; }
  #tbar { height: 100%; width: 0; background: linear-gradient(90deg, #8b5cf6, #22d3ee); border-radius: 4px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .stat { background: rgba(255, 255, 255, .035); border: 1px solid var(--line); border-radius: 9px; padding: 6px 7px; }
  .stat label { display: block; font-size: 10px; color: var(--muted); }
  .stat b { font-family: var(--mono); font-size: 15px; }
  .stat.score b { color: var(--accent); text-shadow: 0 0 12px rgba(34, 211, 238, .5); }
  .section { margin: 14px 0 6px; font-size: 10px; letter-spacing: .12em; color: var(--muted); }

  .drone { display: flex; gap: 10px; padding: 8px 9px; border-radius: 10px; border: 1px solid transparent;
           cursor: pointer; transition: background .15s, border-color .15s; }
  .drone + .drone { margin-top: 4px; }
  .drone:hover { background: rgba(255, 255, 255, .04); }
  .drone.sel { background: rgba(34, 211, 238, .07); border-color: rgba(34, 211, 238, .35); }
  .swatch { width: 4px; border-radius: 4px; background: var(--c); box-shadow: 0 0 10px var(--c); flex: none; }
  .dmain { flex: 1; min-width: 0; }
  .dname { font-weight: 700; }
  .chip { font-size: 10px; padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor; }
  .chip.flying { color: var(--accent); } .chip.landing { color: var(--warn); } .chip.landed { color: var(--good); }
  .chip.crashed, .chip.dead { color: var(--bad); }
  .small { font-size: 11px; }
  .link { font-size: 10px; color: var(--muted); opacity: .45; }
  .link.on { color: var(--good); opacity: 1; }
  .bar { height: 4px; background: rgba(255, 255, 255, .07); border-radius: 4px; margin-top: 5px; overflow: hidden; }
  .batt { height: 100%; border-radius: 4px; transition: width .3s; }
  .hint { margin-top: 12px; font-size: 10.5px; color: var(--muted); }
  kbd { font-family: var(--mono); font-size: 10px; padding: 0 4px; border: 1px solid var(--line);
        border-radius: 4px; background: rgba(255, 255, 255, .05); }

  /* ---------------------------------------------------------- event log */
  #log { top: 14px; right: 14px; width: 270px; padding: 12px 14px; }
  #events { list-style: none; margin: 6px 0 0; padding: 0; }
  #events li { display: flex; gap: 8px; padding: 4px 0; border-top: 1px solid var(--line); font-size: 12px;
               animation: slide .35s ease-out; }
  #events li:first-child { border-top: 0; }
  #events li:nth-child(n+5) { opacity: .55; }
  #events .t { font-family: var(--mono); color: var(--muted); font-size: 11px; min-width: 38px; }
  #events .good { color: var(--good); } #events .bad { color: var(--bad); } #events .warn { color: var(--warn); }
  @keyframes slide { from { opacity: 0; transform: translateX(10px); } }

  /* ---------------------------------------------------------- control dock */
  #dock { left: 50%; bottom: 14px; transform: translateX(-50%); padding: 10px 12px; display: flex; flex-direction: column;
          gap: 8px; width: max-content; max-width: calc(100% - 28px); }
  #dock .line { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: center; }
  .group { display: flex; align-items: center; gap: 6px; }
  .group > span { font-size: 10px; color: var(--muted); letter-spacing: .08em; }
  .seg { display: inline-flex; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
  .seg button, #pause { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; border-radius: 7px;
                        padding: 4px 9px; cursor: pointer; }
  .seg button:hover { color: var(--text); }
  .seg button.on { color: #061016; background: var(--accent); font-weight: 700; }
  #pause { color: #061016; background: var(--accent); font-weight: 700; min-width: 76px; }
  #pause.paused { background: var(--warn); }
  .toggle { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer;
            padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); user-select: none; }
  .toggle input { display: none; }
  .toggle::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .18); }
  .toggle:has(input:checked) { color: var(--text); border-color: rgba(34, 211, 238, .4); }
  .toggle:has(input:checked)::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  input[type=range] { accent-color: var(--accent); width: 90px; }

  /* ---------------------------------------------------------- 3D labels */
  .tag { font: 700 10px/1 var(--mono); padding: 3px 6px; border-radius: 6px; color: #fff; white-space: nowrap;
         background: rgba(8, 12, 18, .72); border: 1px solid var(--c, #fff); transform: translateY(-14px); }
  .tag.dead { opacity: .6; text-decoration: line-through; }
  .tag.art { font-family: Inter, sans-serif; font-weight: 500; border-color: rgba(255, 255, 255, .25); color: #c6d0dc; }
  .tag.art.found { border-color: var(--good); color: var(--good); }
  .tag.base { border-color: var(--accent); color: var(--accent); letter-spacing: .1em; }
  body.no-labels #labels { display: none; }

  /* ---------------------------------------------------------- final card */
  #final { display: none; position: absolute; inset: 0; background: rgba(3, 5, 9, .55); backdrop-filter: blur(3px); cursor: pointer; }
  #final .card { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 360px; padding: 22px 24px;
                 text-align: center; animation: pop .4s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(.85); opacity: 0; } }
  #final .label { font-size: 11px; letter-spacing: .2em; color: var(--muted); }
  #fScore { font: 700 54px/1.1 var(--mono); color: var(--accent); text-shadow: 0 0 24px rgba(34, 211, 238, .55); margin: 6px 0 14px; }
  #fGrid { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 12px; text-align: left; font-size: 12.5px; }
  #fGrid .pts { font-family: var(--mono); color: var(--accent); text-align: right; }
  #fGrid .v { font-family: var(--mono); text-align: right; }
  #fGrid hr { grid-column: 1 / -1; border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }

  #hud { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .15) transparent; }
  @media (max-width: 900px) { #log { display: none; } #hud { width: 260px; } }
  @media (max-height: 700px) { .hint { display: none; } .clock { margin-top: 8px; font-size: 22px; } }
</style>
</head>
<body>
<div id="hud" class="panel">
  <div class="row">
    <div class="brand">
      <div class="logo"></div>
      <div><div class="title">CAVE DRONE SIM</div><div class="sub"><span id="mapname">-</span> · <span id="status" class="conn">connecting</span></div></div>
    </div>
  </div>
  <div class="clock"><span id="time">0.0</span><small> / <span id="tmax">600</span> s</small></div>
  <div class="progress"><div id="tbar"></div></div>
  <div class="stats">
    <div class="stat score"><label>Score</label><b id="score">0</b></div>
    <div class="stat"><label>Artifacts</label><b id="arts">0/0</b></div>
    <div class="stat"><label>Coverage</label><b id="cov">0%</b></div>
    <div class="stat"><label>Home</label><b id="ret">0</b></div>
  </div>
  <div class="section">DRONES</div>
  <div id="drones"></div>
  <div class="hint"><kbd>1</kbd>–<kbd>9</kbd> select drone · <kbd>C</kbd> camera · <kbd>Space</kbd> pause · <kbd>H</kbd> hide UI</div>
</div>

<div id="log" class="panel">
  <div class="section" style="margin:0">MISSION LOG</div>
  <ul id="events"></ul>
</div>

<div id="dock" class="panel">
  <div class="line">
    <button id="pause">Pause</button>
    <div class="group"><span>SPEED</span>
      <div class="seg" id="speed">
        <button data-v="0.5">0.5x</button><button data-v="1">1x</button><button data-v="2" class="on">2x</button>
        <button data-v="5">5x</button><button data-v="0">Max</button>
      </div>
    </div>
    <div class="group"><span>CAMERA</span>
      <div class="seg" id="cam">
        <button data-v="orbit" class="on">Overview</button><button data-v="follow">Follow</button>
        <button data-v="chase">Chase</button><button data-v="fpv">FPV</button>
      </div>
    </div>
    <div class="group"><span>CAVE</span>
      <div class="seg" id="caveStyle">
        <button data-v="holo" class="on">Hologram</button><button data-v="rock">Rock</button><button data-v="off">Hidden</button>
      </div>
      <input type="range" id="opacity" min="0" max="100" value="70" title="Cave brightness / opacity">
    </div>
  </div>
  <div class="line">
    <label class="toggle"><input type="checkbox" id="cTruth" checked>Ground truth</label>
    <label class="toggle"><input type="checkbox" id="cLidar" checked>LiDAR</label>
    <label class="toggle"><input type="checkbox" id="cMap" checked>Map</label>
    <label class="toggle"><input type="checkbox" id="cOdom" checked>Odometry</label>
    <label class="toggle"><input type="checkbox" id="cTrail" checked>Trails</label>
    <label class="toggle"><input type="checkbox" id="cLinks" checked>Comms</label>
    <label class="toggle"><input type="checkbox" id="cDebug" checked>Agent debug</label>
    <label class="toggle"><input type="checkbox" id="cLabels" checked>Labels</label>
    <label class="toggle"><input type="checkbox" id="cBloom" checked>Glow</label>
  </div>
</div>

<div id="final">
  <div class="card panel">
    <div class="label">MISSION COMPLETE</div>
    <div id="fScore">0</div>
    <div id="fGrid"></div>
    <div class="hint">Click anywhere to close</div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
