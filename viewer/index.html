<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Cave Drone Sim</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1014; color: #d8dee6;
               font: 13px/1.4 system-ui, "Malgun Gothic", sans-serif; }
  #hud { position: absolute; top: 10px; left: 10px; width: 290px; background: rgba(16,20,26,.88);
         border: 1px solid #2a323d; border-radius: 6px; padding: 10px 12px; }
  #hud h1 { font-size: 14px; margin: 0 0 6px; }
  .row { display: flex; justify-content: space-between; }
  .drone { margin-top: 6px; padding-top: 6px; border-top: 1px solid #2a323d; cursor: pointer; }
  .drone.sel { background: rgba(80,120,170,.15); }
  .bar { height: 5px; background: #2a323d; border-radius: 3px; margin-top: 3px; }
  .bar > div { height: 100%; border-radius: 3px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  #controls { position: absolute; bottom: 10px; left: 10px; background: rgba(16,20,26,.88);
              border: 1px solid #2a323d; border-radius: 6px; padding: 8px 10px; }
  #controls label { margin-right: 10px; white-space: nowrap; }
  button, select { background: #222a34; color: #d8dee6; border: 1px solid #3a4452; border-radius: 4px; padding: 2px 8px; }
  #status { position: absolute; top: 10px; right: 10px; background: rgba(16,20,26,.88);
            border: 1px solid #2a323d; border-radius: 6px; padding: 6px 10px; }
  #sensorbtns { margin-top: 6px; padding-top: 6px; border-top: 1px solid #2a323d; }
  #sensorbtns button { margin: 2px 2px 0 0; }
  #final { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
           background: rgba(16,20,26,.95); border: 1px solid #4a5868; border-radius: 8px; padding: 16px 20px; }
  #final pre { margin: 8px 0 0; }
  .muted { color: #8793a3; }
  #fpvhud { display: none; position: absolute; pointer-events: none; overflow: hidden;
            border: 1px solid #4a5868; border-radius: 4px; box-sizing: border-box;
            font: 12px/1.35 ui-monospace, Consolas, monospace; color: #b8f5c8; text-shadow: 0 0 3px #000; }
  #fpvhud .tl { position: absolute; top: 6px; left: 8px; }
  #fpvhud .tr { position: absolute; top: 6px; right: 8px; text-align: right; }
  #fpvhud .warn { color: #ff6b6b; font-weight: bold; }
  #fpvCross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px;
              border: 1px solid rgba(184,245,200,.7); border-radius: 50%; }
  #fpvHorizonBox { position: absolute; left: 0; right: 0; top: 50%; height: 0; }
  #fpvHorizon { position: absolute; left: 30%; right: 30%; top: 0; border-top: 1px dashed rgba(184,245,200,.6); }
  #fpvAlert { position: absolute; top: 40%; width: 100%; text-align: center; font-size: 22px; color: #ff6b6b; }
</style>
</head>
<body>
<div id="hud">
  <h1>Cave Drone Sim <span class="muted" id="mapname"></span></h1>
  <div class="row"><span>시간</span><span id="time">-</span></div>
  <div class="row"><span>점수</span><span id="score">-</span></div>
  <div class="row"><span>목표물</span><span id="arts">-</span></div>
  <div class="row"><span>탐사율</span><span id="cov">-</span></div>
  <div id="drones"></div>
  <div id="sensorbtns">
    <div class="muted" style="margin:8px 0 4px">선택한 드론의 센서 창 열기</div>
    <button data-sensor="lidar">LiDAR</button>
    <button data-sensor="imu">IMU</button>
    <button data-sensor="alt">고도</button>
    <button data-sensor="odom">위치 추정</button>
    <button data-sensor="status">상태</button>
  </div>
</div>
<div id="status">연결 중...</div>
<div id="fpvhud">
  <div class="tl"><b id="fpvTitle">FPV</b><br>속도 <span id="fpvSpd">-</span><br>벽까지 <span id="fpvClr">-</span><br>교란 <span id="fpvGust">-</span></div>
  <div class="tr"><span id="fpvAtt">-</span><br>배터리 <span id="fpvBat">-</span></div>
  <div id="fpvCross"></div>
  <div id="fpvHorizonBox"><div id="fpvHorizon"></div></div>
  <div id="fpvAlert"></div>
</div>
<div id="controls">
  <button id="pause">일시정지</button>
  <select id="speed">
    <option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option>
    <option value="5">5x</option><option value="0">최대</option>
  </select>
  <label><input type="checkbox" id="cTruth" checked> 목표물 정답</label>
  <label><input type="checkbox" id="cLidar" checked> LiDAR</label>
  <label><input type="checkbox" id="cOdom" checked> 추정 위치</label>
  <label><input type="checkbox" id="cTrail" checked> 궤적</label>
  <label><input type="checkbox" id="cLinks" checked> 통신</label>
  <label><input type="checkbox" id="cDebug" checked> 에이전트 디버그</label>
  <label><input type="checkbox" id="cFollow"> 선택 드론 따라가기</label>
  <label><input type="checkbox" id="cFpv" checked> 1인칭(FPV)</label>
  <button id="fpvBig">FPV 크게 (V)</button>
  <label>동굴 <input type="range" id="opacity" min="0" max="100" value="35" style="width:80px"></label>
</div>
<div id="final"><b>임무 종료</b><pre id="finalText"></pre></div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
